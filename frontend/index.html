<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acortador de enlaces</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/>
        <path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>
      </svg>
    </div>

    <h1>Acorta tus <span class="grad">enlaces</span></h1>
    <p class="subtitle">Pega una URL larga y obtén un enlace corto que te lleva directo al destino original.</p>

    <form id="form" novalidate>
      <div class="field">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
        <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" aria-label="URL original"
               placeholder="https://www.example.com/articulos/arquitectura-cloud" />
        <button id="btn" type="submit">Acortar</button>
      </div>
    </form>

    <div id="error" class="error" role="alert" hidden></div>

    <section id="result" class="result" hidden>
      <div class="result-head">
        <span class="badge">✓ Enlace creado</span>
        <span class="hint">Redirige con HTTP 307</span>
      </div>
      <div class="short-row">
        <input id="short" type="text" readonly aria-label="Enlace corto" />
        <button id="copy" type="button" class="copy">Copiar</button>
      </div>
      <a id="open" href="#" target="_blank" rel="noopener">Probar enlace ↗</a>
    </section>

    <div class="chips">
      <span>S3</span><span>EC2</span><span>DynamoDB</span><span>FastAPI</span>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
